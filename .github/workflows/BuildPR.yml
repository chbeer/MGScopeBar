name: build-mgscopebar

on: [pull_request]

jobs:
  buildGitx:
    name: Build
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        xcode: [ 26.3 ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - name: ls Xcode
        run: ls -la /Applications/Xcode*
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}
      - name: Build project
        run: xcodebuild -project MGScopeBar.xcodeproj -scheme MGScopeBar.framework build ARCHS="arm64 x86_64" CODE_SIGNING_ALLOWED=NO
